<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blog Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <article class="blog-card">

    <img
      src="images/Nature.jpeg"
      alt="Mountain"
      class="cover"
    >

    <div class="content">

      <div class="meta">
        <span class="category">Design</span>
        <span class="date">May 25, 2024</span>
      </div>

      <h2 class="title">
        The Power of Good Typography
      </h2>

      <p class="subtitle">
        How typography can make or break your design.
      </p>

      <p class="excerpt">
        Typography is more than just picking a pretty font.
        It's about creating a visual hierarchy, guiding the
        reader's eye, and making your content easy and
        enjoyable to read.
      </p>

      <div class="author">

        <img
          src="images/Male.jpeg"
          alt="Author"
          class="avatar"
        >

        <div class="info">
          <h4>By Alex Johnson</h4>
          <span class="read-time">5 min read</span>
        </div>

      </div>

    </div>

  </article>

</body>
</html>
